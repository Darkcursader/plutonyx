# Builds the Web edition and publishes it to the gh-pages branch (GitHub Pages).
# Portions generated with the assistance of an SI tool (Claude) and reviewed by Team PlutonyX.
name: Deploy web edition
on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: touch web/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
